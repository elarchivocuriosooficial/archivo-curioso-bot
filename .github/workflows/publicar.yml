name: Publicar vídeo

on:
  schedule:
    # 19:07 hora de Madrid (18:07 UTC en invierno) lunes, miércoles, viernes y domingo
    - cron: "7 18 * * 1,3,5,0"
  workflow_dispatch:
    inputs:
      modo:
        description: "prueba (solo genera) o publicar"
        default: "prueba"
        type: choice
        options: [prueba, publicar]

permissions:
  contents: write
  models: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt

      - name: Generar y publicar
        env:
          MODO: ${{ github.event_name == 'schedule' && 'publicar' || inputs.modo }}
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ vars.BUNDLE_TEAM_ID }}
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          PLATAFORMAS: ${{ vars.PLATAFORMAS || 'TIKTOK' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py

      - name: Guardar vídeo como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: salida/
          retention-days: 14
          if-no-files-found: ignore

      - name: Registrar publicado
        if: success()
        run: |
          git config user.name "archivo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/publicados.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Publicado $(date +%F)" && git push)
